<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Phishing Engine: multi-modal phishing detection" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.35">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
    <path d="M160 0V640M320 0V640M480 0V640M640 0V640M800 0V640M960 0V640M1120 0V640"/>
  </g>

  <!-- shield -->
  <g transform="translate(110 70)">
    <path d="M70 0 L140 26 V92 C140 138 108 172 70 188 C32 172 0 138 0 92 V26 Z" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M38 94 L62 118 L104 70" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="290" y="130" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#f8fafc">Phishing Engine</text>
  <text x="292" y="184" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#93c5fd">Multi-modal phishing detection: URL, page text and screenshot</text>
  <rect x="292" y="206" width="220" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- pipeline -->
  <g font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="110" y="300" width="300" height="170" rx="18" fill="#0f2742" stroke="#38bdf8" stroke-width="2"/>
    <text x="260" y="350" font-size="30" font-weight="700" fill="#e0f2fe" text-anchor="middle">URL expert</text>
    <text x="260" y="392" font-size="22" fill="#93c5fd" text-anchor="middle">29 lexical features</text>
    <text x="260" y="428" font-size="22" fill="#93c5fd" text-anchor="middle">XGBoost</text>

    <rect x="490" y="300" width="300" height="170" rx="18" fill="#0f2742" stroke="#38bdf8" stroke-width="2"/>
    <text x="640" y="350" font-size="30" font-weight="700" fill="#e0f2fe" text-anchor="middle">Content expert</text>
    <text x="640" y="392" font-size="22" fill="#93c5fd" text-anchor="middle">Page text, TF-IDF</text>
    <text x="640" y="428" font-size="22" fill="#93c5fd" text-anchor="middle">Naive Bayes</text>

    <rect x="870" y="300" width="300" height="170" rx="18" fill="#0f2742" stroke="#38bdf8" stroke-width="2"/>
    <text x="1020" y="350" font-size="30" font-weight="700" fill="#e0f2fe" text-anchor="middle">Visual expert</text>
    <text x="1020" y="392" font-size="22" fill="#93c5fd" text-anchor="middle">Page screenshot</text>
    <text x="1020" y="428" font-size="22" fill="#93c5fd" text-anchor="middle">MobileNetV2 (Keras)</text>

    <!-- arrows to vote -->
    <g stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M260 470 V520 H540"/>
      <path d="M640 470 V520"/>
      <path d="M1020 470 V520 H740"/>
    </g>
    <rect x="450" y="520" width="380" height="64" rx="32" fill="url(#accent)"/>
    <text x="640" y="562" font-size="28" font-weight="700" fill="#0b1220" text-anchor="middle">Majority vote (2 of 3)</text>

    <text x="110" y="612" font-size="20" fill="#64748b">Flask API  |  Chrome extension (Manifest V3)  |  Selenium live scraping</text>
  </g>
</svg>
